<!DOCTYPE html>
<html lang="en">
<head>
    <title>GemPy Visual Analytics: Isosurfaces</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        #info { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px black;}
        .instruction { font-size: 12px; color: #aaa; margin-top: 4px;}
        
        #loading { position: absolute; top: 50%; width: 100%; text-align: center; font-size: 24px; font-weight: 300; transition: opacity 0.5s; }

        #tooltip {
            position: absolute; display: none; 
            background: rgba(15, 15, 20, 0.95); 
            border: 1px solid #555; border-left: 3px solid #4af;
            padding: 10px; border-radius: 4px; pointer-events: none; z-index: 20; 
            font-family: monospace; font-size: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            min-width: 150px;
        }
        .tt-key { color: #888; }
        .tt-val { color: #eee; font-weight: bold; float: right; margin-left: 15px;}
        .tt-row { border-bottom: 1px solid #333; padding: 3px 0; clear: both; display: block; overflow: auto;}

        #legend-container {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px; border-radius: 6px;
            pointer-events: none; user-select: none;
            backdrop-filter: blur(4px);
        }
        #legend-title { font-size: 14px; margin-bottom: 5px; font-weight: bold; color: #ddd; }
        #legend-bar { width: 200px; height: 16px; margin-bottom: 4px; border: 1px solid #555; }
        .legend-labels { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; font-family: monospace;}
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        GemPy Isosurface Analytics<br/>
        <div class="instruction">
            <b>Left Click + Drag</b>: Rotate &nbsp;|&nbsp; 
            <b>CTRL + Click</b>: Query Voxel &nbsp;|&nbsp; 
            <b>GUI</b>: Switch Render Mode
        </div>
    </div>
    
    <div id="loading">Loading Data...</div>
    <div id="tooltip"></div>

    <div id="legend-container">
        <div id="legend-title">Attribute</div>
        <canvas id="legend-bar"></canvas>
        <div class="legend-labels">
            <span id="legend-min">0</span>
            <span id="legend-max">1</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let renderer, scene, camera, controls, mesh, material;
        
        // const DATA_BASE_URL = 'output_models/webgl';
        const DATA_BASE_URL = './';
        
        let meta = null;
        let fullDataBuffer = null;
        const dataViews = {}; 
        let currentAttrKey = ''; 

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        init();

        async function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x050505);
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(600, 600, 600);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            try {
                await loadData();
                createVolume();
                setupGUI();
                
                switchAttribute(meta.attributes[0].key);

                window.addEventListener('resize', onWindowResize);
                window.addEventListener('mousedown', onMouseDown);
                
                document.getElementById('loading').style.opacity = 0;
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
                
                renderer.setAnimationLoop(animate);
            } catch (e) {
                document.getElementById('loading').innerText = "Error: " + e.message;
                console.error(e);
            }
        }

        async function loadData() {
            const metaResp = await fetch(`${DATA_BASE_URL}/model_meta.json`);
            meta = await metaResp.json();

            const binResp = await fetch(`${DATA_BASE_URL}/${meta.binary_file}`);
            fullDataBuffer = await binResp.arrayBuffer();

            meta.attributes.forEach(attr => {
                if (attr.dtype === 'uint8') {
                    dataViews[attr.key] = new Uint8Array(fullDataBuffer, attr.offset, attr.length);
                } else if (attr.dtype === 'float32') {
                    dataViews[attr.key] = new Float32Array(fullDataBuffer, attr.offset, attr.length);
                }
            });
        }

        function createVolume() {
            const voxelCount = meta.width * meta.height * meta.depth;
            const data = new Uint8Array(voxelCount); 
            
            const texture = new THREE.Data3DTexture(data, meta.width, meta.height, meta.depth);
            texture.format = THREE.RedFormat;
            texture.type = THREE.UnsignedByteType;
            // 必须使用 LinearFilter 以支持梯度计算和光滑等值面
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.unpackAlignment = 1;
            texture.needsUpdate = true;

            const vertexShader = /* glsl */`
                in vec3 position;
                uniform mat4 modelMatrix;
                uniform mat4 modelViewMatrix;
                uniform mat4 projectionMatrix;
                uniform vec3 cameraPos;
                out vec3 vOrigin;
                out vec3 vDirection;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                    vOrigin = vec3( inverse( modelMatrix ) * vec4( cameraPos, 1.0 ) ).xyz;
                    vDirection = position - vOrigin;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;

            const fragmentShader = /* glsl */`
                precision highp float;
                precision highp sampler3D;

                in vec3 vOrigin;
                in vec3 vDirection;
                out vec4 color;

                uniform sampler3D map;
                uniform float opacity;
                uniform float steps;
                
                // --- 核心参数 ---
                uniform int uRenderMode; // 0=Volume, 1=Isosurface
                uniform float uIsoThreshold; // 等值面阈值
                
                uniform float uFilterMin;
                uniform float uFilterMax;
                uniform bool uIsDiscrete;
                
                uniform vec3 uVolDims;
                uniform vec3 uPickedCoord; 
                uniform vec3 uClipMin;
                uniform vec3 uClipMax;

                // --- 颜色映射 ---
                vec3 getDiscreteColor(float n) {
                    float id = floor(n * 255.0 + 0.5); 
                    if (id < 0.5) return vec3(0.0);
                    float r = fract(sin(id * 12.9898) * 43758.5453);
                    float g = fract(sin(id * 78.233) * 43758.5453);
                    float b = fract(sin(id * 34.123) * 43758.5453);
                    return vec3(0.2) + 0.8 * vec3(r, g, b); 
                }

                vec3 getContinuousColor(float t) {
                    // Turbo-like
                    return vec3(
                        smoothstep(0.5, 0.8, t) + smoothstep(0.95, 1.0, t)*0.5,
                        smoothstep(0.1, 0.45, t) - smoothstep(0.8, 1.0, t),
                        smoothstep(0.0, 0.2, t) - smoothstep(0.6, 0.9, t)
                    );
                }

                // --- 核心分析函数：计算梯度 (法线) ---
                vec3 getGradient(vec3 p) {
                    // 使用有限差分法计算梯度
                    vec3 eps = vec3(1.0) / uVolDims; // 采样步长为一个体素单位
                    float dx = texture(map, p + vec3(eps.x, 0, 0)).r - texture(map, p - vec3(eps.x, 0, 0)).r;
                    float dy = texture(map, p + vec3(0, eps.y, 0)).r - texture(map, p - vec3(0, eps.y, 0)).r;
                    float dz = texture(map, p + vec3(0, 0, eps.z)).r - texture(map, p - vec3(0, 0, eps.z)).r;
                    return normalize(vec3(dx, dy, dz));
                }

                // --- 光照计算 ---
                vec3 calculateLighting(vec3 pos, vec3 normal, vec3 baseColor, vec3 viewDir) {
                    vec3 lightDir = normalize(vec3(0.5, 0.8, 1.0)); // 固定光照方向
                    
                    // Ambient
                    vec3 ambient = 0.3 * baseColor;
                    
                    // Diffuse
                    float diff = max(dot(normal, lightDir), 0.0);
                    vec3 diffuse = diff * baseColor;
                    
                    // Specular
                    vec3 reflectDir = reflect(-lightDir, normal);
                    float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0);
                    vec3 specular = vec3(0.3) * spec;
                    
                    return ambient + diffuse + specular;
                }

                vec2 hitBox( vec3 orig, vec3 dir ) {
                    const vec3 box_min = vec3( - 0.5 );
                    const vec3 box_max = vec3( 0.5 );
                    vec3 inv_dir = 1.0 / dir;
                    vec3 tmin_tmp = ( box_min - orig ) * inv_dir;
                    vec3 tmax_tmp = ( box_max - orig ) * inv_dir;
                    vec3 tmin = min( tmin_tmp, tmax_tmp );
                    vec3 tmax = max( tmin_tmp, tmax_tmp );
                    float t0 = max( tmin.x, max( tmin.y, tmin.z ) );
                    float t1 = min( tmax.x, min( tmax.y, tmax.z ) );
                    return vec2( t0, t1 );
                }

                void main(){
                    vec3 rayDir = normalize( vDirection );
                    vec2 bounds = hitBox( vOrigin, rayDir );
                    if ( bounds.x > bounds.y ) discard;
                    bounds.x = max( bounds.x, 0.0 );

                    vec3 p = vOrigin + bounds.x * rayDir;
                    vec3 inc = 1.0 / abs( rayDir );
                    float delta = min( inc.x, min( inc.y, inc.z ) ) / steps;

                    vec4 ac = vec4( 0.0 );

                    // 光线步进循环
                    for ( float t = bounds.x; t < bounds.y; t += delta ) {
                        vec3 texCoord = p + 0.5;
                        
                        // 1. 空间切片
                        if ( any(lessThan(texCoord, uClipMin)) || any(greaterThan(texCoord, uClipMax)) ) {
                            p += rayDir * delta; continue;
                        }

                        float val = texture( map, texCoord ).r;

                        // === MODE 1: Isosurface Rendering (等值面) ===
                        if (uRenderMode == 1) {
                            // 如果值大于阈值，说明撞到了等值面
                            if (val >= uIsoThreshold) {
                                vec3 col;
                                if (uIsDiscrete) col = getDiscreteColor(val);
                                else col = getContinuousColor(val);
                                
                                // 计算法线
                                vec3 normal = getGradient(texCoord);
                                // 如果法线长度为0(均匀区域)，给个默认值
                                if (length(normal) < 0.1) normal = -rayDir;
                                
                                // 计算光照
                                vec3 litColor = calculateLighting(p, normal, col, -rayDir);
                                
                                color = vec4(litColor, 1.0); // 完全不透明
                                
                                // 处理 Picking 高亮
                                ivec3 currentIdx = ivec3(floor(texCoord * uVolDims));
                                if (currentIdx == ivec3(uPickedCoord)) {
                                    color.rgb = vec3(1.0);
                                }
                                
                                return; // 直接返回，不再累积
                            }
                        }
                        
                        // === MODE 0: Volumetric Rendering (体渲染) ===
                        else {
                            if ( val >= uFilterMin && val <= uFilterMax ) {
                                vec3 col;
                                if (uIsDiscrete) col = getDiscreteColor(val);
                                else col = getContinuousColor(val);

                                // Picking
                                ivec3 currentIdx = ivec3(floor(texCoord * uVolDims));
                                float alpha = opacity;
                                
                                if (currentIdx == ivec3(uPickedCoord)) {
                                    col = vec3(1.0); alpha = 1.0;     
                                } else if (uPickedCoord.x >= 0.0) {
                                    alpha *= 0.15; col *= 0.5;
                                }

                                ac.rgb += ( 1.0 - ac.a ) * alpha * col;
                                ac.a += ( 1.0 - ac.a ) * alpha;
                                if ( ac.a >= 0.98 ) break;
                            }
                        }
                        
                        p += rayDir * delta;
                    }
                    
                    color = ac;
                    if ( color.a == 0.0 ) discard;
                }
            `;

            material = new THREE.RawShaderMaterial({
                glslVersion: THREE.GLSL3,
                uniforms: {
                    map: { value: texture },
                    cameraPos: { value: new THREE.Vector3() },
                    // 渲染模式
                    uRenderMode: { value: 0 }, // 0: Volume, 1: Isosurface
                    uIsoThreshold: { value: 0.5 },
                    // 过滤与显示
                    uFilterMin: { value: 0.0 },
                    uFilterMax: { value: 1.0 },
                    opacity: { value: 0.5 },
                    steps: { value: 200 },
                    uIsDiscrete: { value: true },
                    uVolDims: { value: new THREE.Vector3(meta.width, meta.height, meta.depth) },
                    uPickedCoord: { value: new THREE.Vector3(-1, -1, -1) },
                    uClipMin: { value: new THREE.Vector3(0,0,0) },
                    uClipMax: { value: new THREE.Vector3(1,1,1) }
                },
                vertexShader,
                fragmentShader,
                side: THREE.BackSide,
                transparent: true
            });

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            mesh = new THREE.Mesh(geometry, material);
            
            const b = meta.bounds;
            const realSize = new THREE.Vector3(b.max[0]-b.min[0], b.max[1]-b.min[1], b.max[2]-b.min[2]);
            const center = new THREE.Vector3((b.max[0]+b.min[0])/2, (b.max[1]+b.min[1])/2, (b.max[2]+b.min[2])/2);
            
            mesh.scale.copy(realSize);
            mesh.position.copy(center);
            
            scene.add(mesh);
            controls.target.copy(center);
            controls.update();
        }

        function switchAttribute(attrKey) {
            currentAttrKey = attrKey;
            const attrMeta = meta.attributes.find(a => a.key === attrKey);
            
            const view = dataViews[attrKey];
            const voxelCount = meta.width * meta.height * meta.depth;
            const texData = new Uint8Array(voxelCount);
            
            const min = attrMeta.min;
            const max = attrMeta.max;
            const range = max - min;

            for(let i=0; i<voxelCount; i++) {
                let norm = (view[i] - min) / (range > 1e-5 ? range : 1.0);
                if (norm < 0) norm = 0; if (norm > 1) norm = 1;
                texData[i] = Math.floor(norm * 255);
            }

            material.uniforms.map.value.image.data = texData;
            material.uniforms.map.value.needsUpdate = true;
            
            material.uniforms.uIsDiscrete.value = attrMeta.is_discrete;
            
            // 重置状态
            material.uniforms.uFilterMin.value = 0.0;
            material.uniforms.uFilterMax.value = 1.0;
            
            // 如果是连续数据，默认开启等值面体验更好
            // if (!attrMeta.is_discrete) material.uniforms.uRenderMode.value = 1;

            document.getElementById('legend-title').innerText = attrMeta.name;
            document.getElementById('legend-min').innerText = attrMeta.min.toFixed(2);
            document.getElementById('legend-max').innerText = attrMeta.max.toFixed(2);
            updateLegendCanvas(attrMeta.is_discrete);
        }

        function updateLegendCanvas(isDiscrete) {
            const canvas = document.getElementById('legend-bar');
            canvas.width = 200; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            
            if (isDiscrete) {
                const w = 200 / 6; 
                for(let i=0; i<6; i++) {
                    const id = i;
                    const r = Math.abs(Math.sin(id * 12.9898) * 43758.5453 % 1);
                    const g = Math.abs(Math.sin(id * 78.233) * 43758.5453 % 1);
                    const b = Math.abs(Math.sin(id * 34.123) * 43758.5453 % 1);
                    const R = Math.floor((0.2 + 0.8*r)*255);
                    const G = Math.floor((0.2 + 0.8*g)*255);
                    const B = Math.floor((0.2 + 0.8*b)*255);
                    ctx.fillStyle = `rgb(${R},${G},${B})`;
                    ctx.fillRect(i*w, 0, w, 16);
                }
            } else {
                const grad = ctx.createLinearGradient(0, 0, 200, 0);
                grad.addColorStop(0.0, '#000033'); 
                grad.addColorStop(0.2, '#00aaff'); 
                grad.addColorStop(0.5, '#00ff00'); 
                grad.addColorStop(0.8, '#ffff00'); 
                grad.addColorStop(1.0, '#ff0000'); 
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 200, 16);
            }
        }

        function roundValue(value, digits = 4) {
            const n = Number(value);
            if (!Number.isFinite(n)) return null;
            const scale = Math.pow(10, digits);
            return Math.round(n * scale) / scale;
        }

        const EXPORT_HAN_PATTERN = /\p{Script=Han}/u;

        function decodeExportUnicodeEscapes(value) {
            return String(value ?? '').replace(/\\u([0-9a-fA-F]{4})/g, (_, code) =>
                String.fromCharCode(Number.parseInt(code, 16))
            );
        }

        function findCjkExportIssue(filename, content) {
            const decodedFilename = decodeExportUnicodeEscapes(filename);
            const filenameMatch = decodedFilename.match(EXPORT_HAN_PATTERN);
            if (filenameMatch) {
                return { line: 0, character: filenameMatch[0], excerpt: decodedFilename };
            }

            const lines = String(content ?? '').split(/\r?\n/);
            for (let index = 0; index < lines.length; index += 1) {
                const decodedLine = decodeExportUnicodeEscapes(lines[index]);
                const match = decodedLine.match(EXPORT_HAN_PATTERN);
                if (match) {
                    return {
                        line: index + 1,
                        character: match[0],
                        excerpt: decodedLine.trim().slice(0, 160) || match[0]
                    };
                }
            }
            return null;
        }

        function assertEnglishExport(filename, content) {
            const issue = findCjkExportIssue(filename, content);
            if (!issue) return;
            const location = issue.line === 0 ? 'filename' : 'line ' + issue.line;
            const message = 'Export blocked: "' + filename + '" contains CJK text at ' + location + ': ' + issue.excerpt;
            if (typeof alert === 'function') alert(message);
            throw new Error(message);
        }

        function downloadJson(filename, data) {
            assertEnglishExport(filename, JSON.stringify(data, null, 2));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function csvValue(value) {
            if (value == null) return '';
            const text = String(value);
            return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        }

        function toCsv(rows, fields) {
            return [fields.join(','), ...rows.map(row => fields.map(field => csvValue(row[field])).join(','))].join('\n');
        }

        function downloadText(filename, text, type = 'text/plain') {
            assertEnglishExport(filename, text);
            const blob = new Blob([text], { type });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function downloadBuffer(filename, buffer) {
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function downloadFiles(files) {
            files.forEach((file) => {
                if (!file.buffer) assertEnglishExport(file.filename, file.content ?? '');
            });
            files.forEach((file, index) => {
                setTimeout(() => {
                    if (file.buffer) downloadBuffer(file.filename, file.buffer);
                    else downloadText(file.filename, file.content, file.type || 'text/plain');
                }, index * 120);
            });
        }

        function voxelCenter(ix, iy, iz) {
            const min = meta.bounds.min;
            const max = meta.bounds.max;
            const sx = (max[0] - min[0]) / meta.width;
            const sy = (max[1] - min[1]) / meta.height;
            const sz = (max[2] - min[2]) / meta.depth;
            return {
                x: min[0] + (ix + 0.5) * sx,
                y: min[1] + (iy + 0.5) * sy,
                z: min[2] + (iz + 0.5) * sz,
                sizeX: sx,
                sizeY: sy,
                sizeZ: sz
            };
        }

        function minevisVolumeMetadata(kind) {
            return {
                createdBy: 'MineVis DataGenerator GeoVolume',
                sourceTool: 'GeoVolume/viewer_multi_attri.html',
                exportKind: kind,
                generatedAt: new Date().toISOString(),
                bounds: meta.bounds,
                grid: { width: meta.width, height: meta.height, depth: meta.depth, totalVoxels: meta.total_voxels },
                binaryFile: meta.binary_file,
                attributes: meta.attributes
            };
        }

        function buildBoundsObj(objectName = 'GB_volume_model') {
            const min = meta.bounds.min;
            const max = meta.bounds.max;
            return [
                '# MineVis GeoVolume body boundary',
                `o ${objectName}`,
                `v ${min[0]} ${min[1]} ${min[2]}`,
                `v ${max[0]} ${min[1]} ${min[2]}`,
                `v ${max[0]} ${max[1]} ${min[2]}`,
                `v ${min[0]} ${max[1]} ${min[2]}`,
                `v ${min[0]} ${min[1]} ${max[2]}`,
                `v ${max[0]} ${min[1]} ${max[2]}`,
                `v ${max[0]} ${max[1]} ${max[2]}`,
                `v ${min[0]} ${max[1]} ${max[2]}`,
                'f 1 2 3 4',
                'f 5 8 7 6',
                'f 1 5 6 2',
                'f 2 6 7 3',
                'f 3 7 8 4',
                'f 4 8 5 1'
            ].join('\n');
        }

        function buildVolumeBodyFiles() {
            const bodyRows = [{ body_id: 'GB_volume_model', body_name: 'Volume Geological Body', body_type: 'volumetric_block', lithology: 'mixed', ore_type: 'metallic', color: '#7aa6c2', confidence: 1 }];
            const surfaceRows = [{ surface_id: 'SURF_volume_boundary', mesh_part_id: 'GB_volume_model', body_id: 'GB_volume_model', surface_type: 'volume_boundary', confidence: 1 }];
            return [
                { filename: 'geovolume_geological_bodies.obj', content: buildBoundsObj(), type: 'text/plain' },
                { filename: 'geovolume_bodies.csv', content: toCsv(bodyRows, ['body_id','body_name','body_type','lithology','ore_type','color','confidence']), type: 'text/csv' },
                { filename: 'geovolume_surfaces.csv', content: toCsv(surfaceRows, ['surface_id','mesh_part_id','body_id','surface_type','confidence']), type: 'text/csv' }
            ];
        }

        function buildResourceBlockGridJson() {
            const min = meta.bounds.min;
            const max = meta.bounds.max;
            return {
                nx: meta.width,
                ny: meta.height,
                nz: meta.depth,
                origin: min,
                cellSize: [
                    (max[0] - min[0]) / meta.width,
                    (max[1] - min[1]) / meta.height,
                    (max[2] - min[2]) / meta.depth
                ],
                bounds: meta.bounds,
                coordinateSystem: 'local',
                binaryFile: 'resource_block_attributes.bin',
                attributes: meta.attributes.map(attr => ({
                    attributeName: attr.key,
                    key: attr.key,
                    label: attr.name,
                    dtype: attr.dtype,
                    offset: attr.offset,
                    length: attr.length,
                    min: attr.min,
                    max: attr.max,
                    nodata: null
                }))
            };
        }

        function buildAttributeSchemaCsv() {
            const rows = meta.attributes.map(attr => ({
                attribute_name: attr.key,
                unit: attr.name.match(/\(([^)]+)\)/)?.[1] || '',
                value_type: attr.dtype,
                min: attr.min,
                max: attr.max,
                nodata: '',
                description: attr.name
            }));
            return toCsv(rows, ['attribute_name','unit','value_type','min','max','nodata','description']);
        }

        function buildResourceBlockFiles() {
            return [
                { filename: 'resource_block_grid.json', content: JSON.stringify(buildResourceBlockGridJson(), null, 2), type: 'application/json' },
                { filename: 'resource_block_attribute_schema.csv', content: buildAttributeSchemaCsv(), type: 'text/csv' },
                { filename: 'resource_block_attributes.bin', buffer: fullDataBuffer }
            ];
        }

        function buildMineVisVolumeGeologicalBody() {
            return {
                datasetType: 'GeologicalBody',
                semanticClass: 'GeologicalBody',
                version: '1.0',
                representationProfile: 'volumetric-block',
                metadata: minevisVolumeMetadata('geological-body'),
                units: [
                    { id: 'GU_volume_model', geologicalUnitId: 'GU_volume_model', geologicalUnitName: 'Volume Geological Body', geologicalUnitType: 'volumetric_block_model' }
                ],
                bodies: [
                    { bodyId: 'GB_volume_model', bodyName: 'Volume Geological Body', geologicalUnitId: 'GU_volume_model', geologicalUnitType: 'volumetric-block' }
                ],
                blocks: [
                    {
                        blockId: 'volume_grid_support',
                        bodyId: 'GB_volume_model',
                        geometry: { form: 'VoxelGrid', bounds: meta.bounds, width: meta.width, height: meta.height, depth: meta.depth }
                    }
                ],
                attributes: meta.attributes.map(attr => ({ attributeName: attr.key, label: attr.name, valueType: attr.dtype, min: attr.min, max: attr.max })),
                relations: [{ relationType: 'bodyHasVoxelGrid', bodyId: 'GB_volume_model', blockId: 'volume_grid_support' }]
            };
        }

        function buildMineVisVolumeAttributeModel() {
            const lithology = dataViews['lithology_id'];
            const density = dataViews['density_(g/cm3)'];
            const au = dataViews['au_grade_(g/t)'];
            const rmr = dataViews['rmr_(engineering)'];
            const elements = [];
            for (let iz = 0; iz < meta.depth; iz++) {
                for (let iy = 0; iy < meta.height; iy++) {
                    for (let ix = 0; ix < meta.width; ix++) {
                        const i = ix + iy * meta.width + iz * meta.width * meta.height;
                        const center = voxelCenter(ix, iy, iz);
                        elements.push({
                            elementId: `VOX_${ix}_${iy}_${iz}`,
                            blockId: `VOX_${ix}_${iy}_${iz}`,
                            centroidX: roundValue(center.x, 3),
                            centroidY: roundValue(center.y, 3),
                            centroidZ: roundValue(center.z, 3),
                            blockSizeX: roundValue(center.sizeX, 3),
                            blockSizeY: roundValue(center.sizeY, 3),
                            blockSizeZ: roundValue(center.sizeZ, 3),
                            lithology_id: lithology ? lithology[i] : null,
                            lithology: lithology ? `lithology_${lithology[i]}` : null,
                            density: density ? roundValue(density[i], 4) : null,
                            grade: au ? roundValue(au[i], 5) : null,
                            auGrade: au ? roundValue(au[i], 5) : null,
                            rmr: rmr ? rmr[i] : null,
                            resourceCategory: au && au[i] >= 3 ? 'high_grade' : 'background'
                        });
                    }
                }
            }
            return {
                datasetType: 'GeologicalAttributeModel',
                semanticClass: 'GeologicalAttributeModel',
                version: '1.0',
                representationProfile: 'resource-block',
                metadata: minevisVolumeMetadata('resource-block-model'),
                attributes: [
                    { attributeName: 'lithology_id', valueType: 'uint8', unit: 'category' },
                    { attributeName: 'density', valueType: 'float32', unit: 'g/cm3' },
                    { attributeName: 'grade', valueType: 'float32', unit: 'g/t' },
                    { attributeName: 'rmr', valueType: 'uint8', unit: 'index' }
                ],
                elements
            };
        }

        function setupGUI() {
            const gui = new GUI({ title: 'GemPy Analytics', width: 320 });
            
            // 1. Data Source
            const dataFolder = gui.addFolder('Data & Attribute');
            const attrObj = {};
            meta.attributes.forEach(a => attrObj[a.name] = a.key);
            
            dataFolder.add({ attr: meta.attributes[0].key }, 'attr', attrObj)
                .name('Select Attribute')
                .onChange(val => switchAttribute(val));

            const exportFolder = gui.addFolder('MineVis Dataset Export');
            exportFolder.add({
                exportGeologicalBody: () => downloadFiles(buildVolumeBodyFiles())
            }, 'exportGeologicalBody').name('Export Geological Body Files');
            exportFolder.add({
                exportAttributeModel: () => downloadFiles(buildResourceBlockFiles())
            }, 'exportAttributeModel').name('Export Resource Block Files');
            exportFolder.add({
                exportLegacyJson: () => {
                    downloadJson('minevis_geovolume_geological_body.json', buildMineVisVolumeGeologicalBody());
                    setTimeout(() => downloadJson('minevis_geovolume_resource_block_model.json', buildMineVisVolumeAttributeModel()), 120);
                }
            }, 'exportLegacyJson').name('Export Legacy JSON Files');
            
            // 2. Render Mode (New Feature!)
            const modeFolder = gui.addFolder('Visualization Mode');
            const modeParams = { 
                mode: 'Volumetric', 
                isoValue: 0.5 
            };
            
            modeFolder.add(modeParams, 'mode', ['Volumetric', 'Isosurface'])
                .name('Render Type')
                .onChange(v => {
                    material.uniforms.uRenderMode.value = (v === 'Isosurface' ? 1 : 0);
                });
                
            modeFolder.add(modeParams, 'isoValue', 0.0, 1.0)
                .name('Isosurface Value')
                .onChange(v => material.uniforms.uIsoThreshold.value = v);

            // 3. Volumetric Filtering
            const filterFolder = gui.addFolder('Volume Filtering');
            const filterParams = { min: 0.0, max: 1.0 };
            
            filterFolder.add(filterParams, 'min', 0.0, 1.0).name('Range Min')
                .onChange(v => material.uniforms.uFilterMin.value = v);
            filterFolder.add(filterParams, 'max', 0.0, 1.0).name('Range Max')
                .onChange(v => material.uniforms.uFilterMax.value = v);
            
            // 4. Clipping
            const clipFolder = gui.addFolder('Spatial Slicing');
            const clip = { xMin:0, xMax:1, yMin:0, yMax:1, zMin:0, zMax:1 };
            const updateClip = () => {
                material.uniforms.uClipMin.value.set(clip.xMin, clip.yMin, clip.zMin);
                material.uniforms.uClipMax.value.set(clip.xMax, clip.yMax, clip.zMax);
            };
            ['xMin','xMax','yMin','yMax','zMin','zMax'].forEach(k => 
                clipFolder.add(clip, k, 0, 1).step(0.01).onChange(updateClip));
            
            // 5. Quality
            const qualFolder = gui.addFolder('Settings');
            qualFolder.add(material.uniforms.opacity, 'value', 0, 1).name('Opacity (Vol Only)');
            qualFolder.add(material.uniforms.steps, 'value', 50, 500).name('Ray Steps');
            
            dataFolder.open();
            modeFolder.open();
        }

        function pickVoxel(clientX, clientY) {
            if (!mesh || !meta) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const inverseMatrix = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
            const localOrigin = raycaster.ray.origin.clone().applyMatrix4(inverseMatrix);
            const localDir = raycaster.ray.direction.clone().transformDirection(inverseMatrix).normalize();

            const boxMin = new THREE.Vector3(-0.5, -0.5, -0.5);
            const boxMax = new THREE.Vector3(0.5, 0.5, 0.5);
            const invDir = new THREE.Vector3(1/localDir.x, 1/localDir.y, 1/localDir.z);
            const tMinVec = boxMin.clone().sub(localOrigin).multiply(invDir);
            const tMaxVec = boxMax.clone().sub(localOrigin).multiply(invDir);
            const t1 = tMinVec.clone().min(tMaxVec);
            const t2 = tMinVec.clone().max(tMaxVec);
            const tNear = Math.max(Math.max(t1.x, t1.y), t1.z);
            const tFar = Math.min(Math.min(t2.x, t2.y), t2.z);

            let hit = null;
            const stepSize = 0.5 / Math.max(meta.width, meta.height);

            if (tNear <= tFar && tFar >= 0) {
                let t = Math.max(tNear, 0);
                for(let i=0; i<800; i++) { 
                    if(t > tFar) break;
                    
                    const p = localOrigin.clone().add(localDir.clone().multiplyScalar(t));
                    const tex = p.clone().addScalar(0.5);
                    
                    const cMin = material.uniforms.uClipMin.value;
                    const cMax = material.uniforms.uClipMax.value;
                    if (tex.x < cMin.x || tex.y < cMin.y || tex.z < cMin.z ||
                        tex.x > cMax.x || tex.y > cMax.y || tex.z > cMax.z) {
                        t += stepSize; continue;
                    }

                    const ix = Math.floor(tex.x * meta.width);
                    const iy = Math.floor(tex.y * meta.height);
                    const iz = Math.floor(tex.z * meta.depth);
                    
                    if(ix>=0 && ix<meta.width && iy>=0 && iy<meta.height && iz>=0 && iz<meta.depth) {
                        const idx = iz*(meta.width*meta.height) + iy*meta.width + ix;
                        const attrMeta = meta.attributes.find(a => a.key === currentAttrKey);
                        const rawVal = dataViews[currentAttrKey][idx];
                        
                        const range = attrMeta.max - attrMeta.min;
                        let norm = (rawVal - attrMeta.min) / (range > 1e-5 ? range : 1.0);
                        if(norm < 0) norm = 0; if(norm > 1) norm = 1;
                        
                        // Picking Logic matches render mode
                        const renderMode = material.uniforms.uRenderMode.value;
                        const isoThresh = material.uniforms.uIsoThreshold.value;
                        const fMin = material.uniforms.uFilterMin.value;
                        const fMax = material.uniforms.uFilterMax.value;

                        let isVisible = false;
                        if (renderMode === 1) { // Isosurface
                            if (norm >= isoThresh) isVisible = true;
                        } else { // Volume
                            if (norm >= fMin && norm <= fMax) isVisible = true;
                        }

                        if (isVisible) {
                            hit = {x: ix, y: iy, z: iz};
                            break;
                        }
                    }
                    t += stepSize;
                }
            }

            if (hit) {
                updateTooltip(hit, clientX, clientY);
                material.uniforms.uPickedCoord.value.set(hit.x, hit.y, hit.z);
            } else {
                document.getElementById('tooltip').style.display = 'none';
                material.uniforms.uPickedCoord.value.set(-1, -1, -1);
            }
        }

        function updateTooltip(gridIndex, x, y) {
            const idx = gridIndex.z*(meta.width*meta.height) + gridIndex.y*meta.width + gridIndex.x;
            
            let html = `<div style="text-align:center; margin-bottom:6px; color:#4af; font-weight:bold; border-bottom:1px solid #444; padding-bottom:4px;">VOXEL [${gridIndex.x}, ${gridIndex.y}, ${gridIndex.z}]</div>`;
            
            meta.attributes.forEach(attr => {
                const val = dataViews[attr.key][idx];
                const isCurrent = (attr.key === currentAttrKey);
                let displayVal = val;
                if (attr.dtype === 'float32') displayVal = val.toFixed(3);
                
                const colorStyle = isCurrent ? 'color: #ffd700;' : '';
                
                html += `
                    <div class="tt-row">
                        <span class="tt-key" style="${colorStyle}">${attr.name}</span>
                        <span class="tt-val" style="${colorStyle}">${displayVal}</span>
                    </div>
                `;
            });
            const tt = document.getElementById('tooltip');
            tt.innerHTML = html;
            tt.style.display = 'block';
            tt.style.left = (x + 20) + 'px';
            tt.style.top = (y + 20) + 'px';
        }

        function onMouseDown(e) {
            if (e.ctrlKey && e.button === 0) {
                pickVoxel(e.clientX, e.clientY);
            } else if (e.button === 0) {
                document.getElementById('tooltip').style.display = 'none';
                if(material) material.uniforms.uPickedCoord.value.set(-1,-1,-1);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if(material) material.uniforms.cameraPos.value.copy(camera.position);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
